<template>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <img src={profilepic} alt="User Icon" class="user-icon"  />
                <span class="username">{userName}</span>
                
                <!-- Settings Icon -->
                <div class="settings-container">
                    <button class="settings-button" style="height: 40px;width: 40px;" onclick={handleSettingsClick}>
                        <img src={settingsIcon} alt="Settings Icon" class="settings-icon" />
                    </button>

                    <!-- Settings Dropdown Menu -->
                    <template if:true={showSettingsMenu}>
                        <div class="settings-dropdown">
                            <ul onclick={handleSettingsOptionClick}>
                               <li data-option="profile">Profile Details</li>
                                <li data-option="personal">Personal Details</li>
                                <li data-option="upload">Upload Photo</li>
                                <li data-option="logout ">Logout</li>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <div class="brand-mark">
                    <span class="brand-dot"></span>
                    <div><strong>Dinesh</strong><small>Component Hub</small></div>
                </div>
                <ul>
                    <li class="menu-item {lwcClass}" onclick={handleMenuClick} data-type="lwc">LWC</li>
                    <li class="menu-item {apexClass}" onclick={handleMenuClick} data-type="apex">Apex</li>
                    <li class="menu-item {auraClass}" onclick={handleMenuClick} data-type="aura">Aura</li>
                    <li class="menu-item {vfClass}" onclick={handleMenuClick} data-type="vf">Visualforce Page</li>
                    <li class="menu-item {moreClass}" onclick={handleMenuClick} data-type="more">More</li>
                </ul>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <template if:true={showDetails}>
                    <section class="component-details">
                        <button class="back-button" type="button" onclick={handleBackToList}>Back to list</button>
                        <h2>{selectedComp.Name}</h2>
                        <div class="details-grid">
                            <div><strong>Id</strong><span>{selectedComp.Id}</span></div>
                            <div><strong>Status</strong><span>{selectedComp.Status__c}</span></div>
                            <div><strong>Type</strong><span>{selectedComp.Type__c}</span></div>
                            <div><strong>Class Name</strong><span>{selectedComp.Comp_Class_Name__c}</span></div>
                            <div><strong>Location</strong><span>{selectedComp.Location__c}</span></div>
                            <div><strong>Org Username</strong><span>{selectedComp.ORG_Name_Username__c}</span></div>
                            <div><strong>Description</strong><span>{selectedComp.Description__c}</span></div>
                            <div><strong>GitHub Repository</strong><span>{selectedComp.GitHub_Repo__c}</span></div>
                            <div><strong>Record URL</strong><span>{selectedComp.Record_URL__c}</span></div>
                            <div class="snapshot-field">
                                <strong>Snapshot</strong>
                                <template if:true={snapshotImageUrl}>
                                    <button class="snapshot-preview-button" type="button" onclick={handleOpenImagePreview} aria-label="Enlarge snapshot image">
                                        <img class="snapshot-image" src={snapshotImageUrl} alt={selectedComp.Name} />
                                    </button>
                                </template>
                                <template if:false={snapshotImageUrl}>
                                    <span>No snapshot image available.</span>
                                </template>
                            </div>
                        </div>
                    </section>
                </template>

                <template if:false={showDetails}>
                <template if:true={isLwcActive}>
                  
                    <table>
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Name</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={lwclistdata} for:item="comp" >
                                <tr key={comp.Id}>
                                    <td>{comp.srNo}</td>
                                    <td><a href="#" data-id={comp.Id} onclick={handleNameClick}>{comp.Name}</a></td>
                                    <td>{comp.Type__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={isApexActive}>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Name</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={apexlistdata} for:item="comp">
                                <tr key={comp.Id}>
                                    <td>{comp.srNo}</td>
                                    <td><a href="#" data-id={comp.Id} onclick={handleNameClick}>{comp.Name}</a></td>
                                    <td>{comp.Type__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={isAuraActive}>
                  
                    <table>
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Name</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={auralistdata} for:item="comp">
                                <tr key={comp.Id}>
                                    <td>{comp.srNo}</td>
                                    <td><a href="#" data-id={comp.Id} onclick={handleNameClick}>{comp.Name}</a></td>
                                    <td>{comp.Type__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={isVfActive}>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Name</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={vfpagelistdata} for:item="comp">
                                <tr key={comp.Id}>
                                    <td>{comp.srNo}</td>
                                    <td><a href="#" data-id={comp.Id} onclick={handleNameClick}>{comp.Name}</a></td>
                                    <td>{comp.Type__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={isMoreActive}>
                    <h2>More Features Coming Soon</h2>
                </template>
                </template>
            </div>
        </div>

        <template if:true={showImagePreview}>
            <div class="image-preview-backdrop" role="presentation" onclick={handleImageBackdropClick}>
                <section class="image-preview-dialog" role="dialog" aria-modal="true" aria-label="Snapshot image preview" onclick={handlePreviewDialogClick}>
                    <button class="image-preview-close" type="button" onclick={handleCloseImagePreview} aria-label="Close image preview">&times;</button>
                    <img class="image-preview-full" src={snapshotImageUrl} alt={selectedComp.Name} />
                </section>
            </div>
        </template>
    </div>
</template>
